<script>
  const MAX_SIZE = 15 * 1024 * 1024; // 15 MB

  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusEl = document.getElementById('status');
  const linkEl = document.getElementById('link');

  uploadBtn.addEventListener('click', async () => {
    statusEl.textContent = '';
    linkEl.textContent = '';

    const file = fileInput.files[0];
    if (!file) {
      statusEl.textContent = 'Please choose a file first.';
      return;
    }

    console.log("Selected file:", file.name, file.size, "bytes");

    if (file.size > MAX_SIZE) {
      statusEl.textContent = 'File is too large. Max size is 15 MB.';
      return;
    }

    statusEl.textContent = 'Uploading to file.io...';
    console.log("Starting upload...");

    const start = performance.now();

    try {
      const formData = new FormData();
      formData.append('file', file);

      console.log("Sending fetch request to file.io...");

      const response = await fetch('https://file.io', {
        method: 'POST',
        body: formData
      });

      console.log("Fetch completed. Response object:", response);

      if (!response.ok) {
        console.error("Response not OK:", response.status, response.statusText);
        statusEl.textContent = 'Upload failed (network or server error).';
        return;
      }

      const text = await response.text();
      console.log("Raw response text:", text);

      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        console.error("JSON parse error:", e);
        statusEl.textContent = 'Upload failed (invalid JSON).';
        return;
      }

      console.log("Parsed JSON:", data);

      if (data.success) {
        statusEl.textContent = 'Upload successful!';
        linkEl.innerHTML = `Download link: <a href="${data.link}" target="_blank">${data.link}</a>`;
      } else {
        statusEl.textContent = 'Upload failed: ' + (data.message || 'Unknown error.');
      }

    } catch (err) {
      console.error("Exception during upload:", err);
      statusEl.textContent = 'Upload failed (exception in script).';
    }

    const end = performance.now();
    console.log("Upload process took", (end - start).toFixed(2), "ms");
  });
</script>
